---
layout: default
---
<article class="piece">
  <h1 class="piece__title">{{ page.title }}</h1>
  <p class="piece__meta">
    {% if page.date %}{{ page.date | date: "%Y" }}{% endif %}
    {% if page.published_in %} &nbsp;&nbsp; {{ page.published_in }}{% endif %}
  </p>
  <div class="piece__body verse">
    {% if page.epigraph %}<p class="verse--epigraph">{{ page.epigraph }}</p>{% endif %}
    {{ content }}
  </div>
</article>
