# ---------------------------------------------------------------
# Edit these four lines. Everything else can stay as it is.
# ---------------------------------------------------------------
title: "two stones for a cairn"
tagline: "Essays, poems, fiction, and articles"
description: "Writing on the Himalayas, climate, place, and memory."
author: "Benu P. Dahal"

# baseurl stays empty for a user site (pbenu.github.io).
# You would only set it if you published at pbenu.github.io/some-repo instead.
baseurl: ""
url: "https://pbenu.github.io"

# ---------------------------------------------------------------
# Below here you shouldn't need to change anything.
# ---------------------------------------------------------------
collections:
  essays:
    output: true
    permalink: /essays/:path/
  poems:
    output: true
    permalink: /poems/:path/
  articles:
    output: true
    permalink: /articles/:path/
  fiction:
    output: true
    permalink: /fiction/:path/

defaults:
  - scope:
      path: ""
      type: essays
    values:
      layout: essay
  - scope:
      path: ""
      type: poems
    values:
      layout: poem
  - scope:
      path: ""
      type: articles
    values:
      layout: analysis
  - scope:
      path: ""
      type: fiction
    values:
    layout: essay
    

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]
  footnote_backlink: "&#8617;"
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
